services:
  # ===== Main API Server =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whapvibez-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=v1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VIDEO_DISABLE_WORKER=1
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - whapvibez-upload-tmp:/tmp/whapvibez-uploads
    networks:
      - whapvibez-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== Dedicated video encoding worker (FFmpeg + BullMQ) =====
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whapvibez-video-worker
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VIDEO_WORKER_ONLY=1
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - whapvibez-upload-tmp:/tmp/whapvibez-uploads
    networks:
      - whapvibez-network
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -v grep | grep -q 'node dist/worker/main.js'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: whapvibez-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - whapvibez-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: whapvibez-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.well-known:/var/www/whapvibez/.well-known:ro
      - ./nginx/legal:/var/www/whapvibez/legal:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - whapvibez-network

networks:
  whapvibez-network:
    external: true
    name: backend_whapvibez-network

volumes:
  redis-data:
    external: true
    name: backend_redis-data
  whapvibez-upload-tmp:
